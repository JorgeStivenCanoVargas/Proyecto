<!doctype html>
<html lang="es">

<head>

  <meta charset="UTF-8" />

  <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
  />

  <title>Recuperar contraseña | Denuncia Garzón</title>


  <!-- =========================================
        TAILWIND CSS
  ========================================== -->
  <script src="https://cdn.tailwindcss.com"></script>


  <!-- =========================================
        LUCIDE ICONS
  ========================================== -->
  <script src="https://unpkg.com/lucide@latest"></script>

</head>


<body
  class="m-0
          min-h-screen
          font-sans
          bg-[#171A2F]
          text-white
          tracking-widest
          antialiased"
>


  <!-- =========================================
        RECUPERAR CONTRASEÑA
  ========================================== -->

  <section
      class="min-h-screen
              flex
              items-center
              justify-center
              px-4
              py-10
              relative
              overflow-hidden"
  >


      <!-- =========================================
            CÍRCULO SUPERIOR IZQUIERDO
      ========================================== -->

      <div
          class="absolute
                  w-32
                  h-32
                  bg-[#0f3460]
                  rounded-full
                  top-[19%]
                  left-[33%]
                  -translate-x-[45%]
                  -translate-y-[45%]
                  pointer-events-none"
      ></div>


      <!-- =========================================
            CONTENEDOR PRINCIPAL
      ========================================== -->

      <div
          class="relative
                  w-full
                  max-w-lg"
      >


          <!-- =========================================
                TARJETA GLASSMORPHISM
          ========================================== -->

          <div
              class="relative
                      z-10
                      w-full
                      border
                      border-white/15
                      rounded-xl
                      shadow-[0_0_36px_1px_rgba(0,0,0,0.2)]
                      backdrop-blur-[20px]
                      p-8
                      sm:p-10
                      overflow-hidden"
          >


              <!-- =========================================
                    ILUSTRACIÓN
              ========================================== -->

              <img
                  src="assets/ImagenLogin.png"
                  alt="Ilustración de policía"
                  class="absolute
                          top-[4rem]
                          right-5
                          w-[40%]
                          sm:w-[35%]
                          object-contain
                          pointer-events-none
                          select-none
                          opacity-100"
              />


              <!-- =========================================
                    ENCABEZADO
              ========================================== -->

              <div
                  class="relative
                          z-10
                          pr-[25%]
                          sm:pr-[20%]"
              >

                  <h1
                      class="text-4xl
                              sm:text-5xl
                              font-extrabold
                              tracking-tight
                              leading-none"
                  >
                      RECUPERAR

                      <span class="block text-blue-500">
                          CONTRASEÑA
                      </span>
                  </h1>


                  <p
                      class="mt-6
                              text-sm
                              sm:text-base
                              leading-relaxed
                              tracking-normal
                              text-[#A8AEC3]"
                  >
                      Ingresa tu correo electrónico y te enviaremos
                      un enlace para restablecer tu contraseña.
                  </p>

              </div>


              <!-- =========================================
                    FORMULARIO
              ========================================== -->

              <form
                  action="#"
                  method="POST"
                  class="relative
                          z-10
                          mt-10"
              >


                  <!-- =====================================
                        CORREO ELECTRÓNICO
                  ====================================== -->

                  <div class="relative">

                      <label
                          for="correo"
                          class="sr-only"
                      >
                          Correo electrónico
                      </label>


                      <!-- Icono -->
                      <i
                          data-lucide="mail"
                          class="absolute
                                  left-5
                                  top-1/2
                                  -translate-y-1/2
                                  w-6
                                  h-6
                                  text-[#A8AEC3]
                                  pointer-events-none"
                      ></i>


                      <!-- Campo -->
                      <input
                          id="correo"
                          type="email"
                          name="correo"
                          placeholder="CORREO ELECTRÓNICO"
                          autocomplete="email"
                          required
                          class="w-full
                                  h-14
                                  pl-14
                                  pr-5
                                  rounded-xl
                                  bg-[#30354D]
                                  border
                                  border-[#454B67]
                                  text-white
                                  placeholder-[#A8AEC3]
                                  outline-none
                                  tracking-[0.8px]
                                  text-[15px]
                                  transition
                                  duration-200
                                  focus:border-blue-500
                                  focus:ring-2
                                  focus:ring-blue-500/20"
                      />

                  </div>


                  <!-- =====================================
                        BOTÓN ENVIAR ENLACE
                  ====================================== -->

                  <button
                      type="submit"
                      class="w-full
                              h-14
                              mt-6
                              rounded-xl
                              bg-blue-600
                              hover:bg-blue-600
                              active:bg-blue-700
                              text-white
                              font-bold
                              text-lg
                              tracking-[2px]
                              border-none
                              cursor-pointer
                              transition-all
                              duration-200
                              shadow-lg
                              hover:shadow-blue-900/30
                              hover:scale-[1.02]
                              active:scale-[0.98]"
                  >
                      ENVIAR ENLACE
                  </button>

              </form>


              <!-- =========================================
                    VOLVER AL LOGIN
              ========================================== -->

              <div
                  class="relative
                          z-10
                          mt-8
                          flex
                          justify-center"
              >

                  <a
                      href="login.html"
                      class="flex
                              items-center
                              gap-2
                              text-sm
                              sm:text-base
                              text-blue-400
                              tracking-wide
                              transition
                              duration-200
                              hover:text-blue-300
                              hover:underline"
                  >

                      <i
                          data-lucide="arrow-left"
                          class="w-5 h-5"
                      ></i>

                      VOLVER AL INICIO DE SESIÓN

                  </a>

              </div>

          </div>


          <!-- =========================================
                CÍRCULO INFERIOR DERECHO
          ========================================== -->

          <div
              class="absolute
                      w-32
                      h-32
                      bg-[#0f3460]
                      rounded-full
                      bottom-0
                      right-0
                      -z-10
                      translate-x-[45%]
                      translate-y-[50%]
                      pointer-events-none"
          ></div>

      </div>

  </section>


  <!-- =========================================
        LUCIDE
  ========================================== -->

  <script>
      lucide.createIcons();
  </script>

</body>

</html>
